<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route Optimiser V6</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--card:#f2f2f4;--acc:#dc0032}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f2;--mut:#999;--card:#1c1c1e}}
body{font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 12px}label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
input,textarea{display:block;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;min-height:44px;width:100%;box-sizing:border-box;font:16px inherit;padding:10px;border:1px solid var(--mut);border-radius:8px;background:var(--card);color:var(--fg)}
input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;height:44px}
textarea{height:110px;font:12px ui-monospace,monospace}
button{width:100%;padding:14px;margin-top:12px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--acc);color:#fff}
button.sec{background:var(--card);color:var(--fg)}button:disabled{opacity:.5}
#log{color:var(--mut);font-size:13px;margin-top:10px;white-space:pre-wrap}
.sum{background:var(--card);border-radius:10px;padding:12px;margin-top:14px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:10px;margin-top:8px}
.pos{font-size:12px;color:var(--mut);width:28px;text-align:center}.stop{font-size:26px;font-weight:700;min-width:58px;text-align:center}
.det{flex:1;min-width:0;font-size:13px}.det b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eta{font-size:13px;text-align:right;color:var(--mut)}.tag{color:var(--acc);font-weight:600}
</style></head><body>
<h1>Route Optimiser V6</h1>
<label>Stops CSV (paste here or choose a file)</label>
<textarea id="csv" placeholder="stop,name,address,postcode,type,parcels,window,dpd_eta,service_mins,notes"></textarea>
<input type="file" id="file" accept=".csv,text/csv,text/plain" style="margin-top:8px">
<label>Depot postcode</label><input id="depot" value="RG24 8PL">
<label>Leave depot at</label><input id="start" type="time" value="07:00">
<button id="go">Optimise route</button>
<div id="log"></div><div id="out"></div>
<script>
//--SOLVER--
const toMin=s=>{const[h,m]=s.split(":");return +h*60+ +m};
const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function hav(a,b){const R=6371,r=Math.PI/180,dp=(b[0]-a[0])*r,dl=(b[1]-a[1])*r;
 const h=Math.sin(dp/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dl/2)**2;
 return 2*R*Math.asin(Math.sqrt(h))*1.4/35*60}// minutes, straight line x1.4 at 35 km/h
// Node 0 = depot, nodes 1..n = stops. D[i][j] minutes, svc[i], lo[i], hi[i] (minutes)
function evaluate(order,D,svc,lo,hi,start){let t=start,prev=0,late=0;
 for(const k of order){t+=D[prev][k];if(t>hi[k])late+=t-hi[k];if(t<lo[k])t=lo[k];t+=svc[k];prev=k}
 t+=D[prev][0];return t+late*1000}
function drive(order,D){let p=0,s=0;for(const k of order){s+=D[p][k];p=k}return s+D[p][0]}
function nearest(n,D){const left=new Set();for(let i=1;i<=n;i++)left.add(i);const o=[];let p=0;
 while(left.size){let b=-1,bd=1e9;for(const k of left)if(D[p][k]<bd){bd=D[p][k];b=k}o.push(b);left.delete(b);p=b}return o}
function localSearch(o,D,svc,lo,hi,start,maxL=3){let best=evaluate(o,D,svc,lo,hi,start),imp=true;
 while(imp){imp=false;const n=o.length;
  for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){ // 2-opt
   const c=o.slice(0,i).concat(o.slice(i,j+1).reverse(),o.slice(j+1));const v=evaluate(c,D,svc,lo,hi,start);
   if(v<best-1e-6){o=c;best=v;imp=true}}
  for(let L=1;L<=maxL;L++)for(let i=0;i+L<=n;i++){ // or-opt: move a block of L stops elsewhere (either way round)
   const seg=o.slice(i,i+L),rest=o.slice(0,i).concat(o.slice(i+L));let moved=false;
   for(let j=0;j<=rest.length&&!moved;j++){if(j===i)continue;
    for(const s of(L>1?[seg,seg.slice().reverse()]:[seg])){
     const c=rest.slice(0,j).concat(s,rest.slice(j));const v=evaluate(c,D,svc,lo,hi,start);
     if(v<best-1e-6){o=c;best=v;imp=true;moved=true;break}}}}}
 return[o,best]}
function perturb(o){const n=o.length,r=()=>1+Math.floor(Math.random()*(n-1));
 const[a,b,c]=[r(),r(),r()].sort((x,y)=>x-y);if(a===b||b===c)return o.slice();
 return o.slice(0,a).concat(o.slice(b,c),o.slice(a,b),o.slice(c))}
async function solve(n,D,svc,lo,hi,start,secs,dpdOrder,onProg){
 const t0=Date.now();let best=null,bv=1e18;
 for(const init of[nearest(n,D),dpdOrder]){const[o,v]=localSearch(init,D,svc,lo,hi,start,20);if(v<bv){bv=v;best=o}}
 let cur=best,cv=bv;
 while(Date.now()-t0<secs*1000){const[o,v]=localSearch(perturb(cur),D,svc,lo,hi,start);
  if(v<cv+0.5){cur=o;cv=v}if(v<bv){best=o;bv=v}
  onProg&&onProg(Math.min(1,(Date.now()-t0)/(secs*1000)));await new Promise(r=>setTimeout(r,0))}
 return[best,bv]}
//--END SOLVER--
//--REFINE--
function parseAddr(a){let s=a.toUpperCase().replace(/\b(OLD BASING|BASINGSTOKE|HAMPSHIRE)\b/g,"").replace(/[,.]/g," ").replace(/\s+/g," ").trim();
 const m=s.match(/^(\d+[A-Z]?) ([A-Z' ]+)$/);if(!m)return null;
 const ab={RD:"ROAD",AVE:"AVENUE",CL:"CLOSE",GDNS:"GARDENS",CT:"COURT"};
 return{num:m[1],street:m[2].trim().split(" ").map(w=>ab[w]||w).join(" ")}}
// Look up real house positions in OpenStreetMap so odd/even and numbering schemes sort themselves out
async function refine(rows,P){const info=rows.map(r=>parseAddr(r.address)),tot=info.filter(Boolean).length;
 if(!tot)return[0,0,"no numbered addresses"];const streets=[...new Set(info.filter(Boolean).map(x=>x.street))];
 const la=P.map(p=>p[0]),lo=P.map(p=>p[1]),pad=0.01;
 const bb=[Math.min(...la)-pad,Math.min(...lo)-pad,Math.max(...la)+pad,Math.max(...lo)+pad].join(",");
 const re=streets.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
 const q='[out:json][timeout:40];nwr["addr:housenumber"]["addr:street"~"^('+re+')$",i]('+bb+');out center tags;';
 let els,why="";for(const url of["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
  try{const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q)}),j=await r.json();if(j.elements){els=j.elements;break}why=j.remark||("HTTP "+r.status)}catch(e){why=String(e.message||e)}}
 if(!els)return[0,tot,"OpenStreetMap lookup failed: "+why];
 const idx={};for(const e of els||[]){const t=e.tags||{},c=e.lat!=null?[e.lat,e.lon]:e.center&&[e.center.lat,e.center.lon];if(!c)continue;
  const k=(t["addr:street"]||"").toUpperCase()+"|"+(t["addr:housenumber"]||"").toUpperCase().replace(/\s/g,"");
  (idx[k]=idx[k]||[]).push({c,pc:(t["addr:postcode"]||"").replace(/\s/g,"").toUpperCase()})}
 let hit=0;rows.forEach((r,i)=>{const x=info[i];if(!x)return;const L=idx[x.street+"|"+x.num];if(!L)return;
  const pc=r.postcode.replace(/\s/g,"").toUpperCase(),m=L.find(y=>y.pc===pc)||(L.length===1&&!L[0].pc?L[0]:null);
  if(m){P[i+1]=m.c;hit++;r.exact=1}});return[hit,tot,els.length+" addresses returned by OpenStreetMap for these streets"]}
// Fallback when no exact positions: within a run of stops on one street/postcode, go in house-number order
function tidy(order,rows,info){const out=order.slice();let i=0;
 while(i<out.length){let j=i;const pc=rows[out[i]-1].postcode;while(j+1<out.length&&rows[out[j+1]-1].postcode===pc)j++;
  const slots=[];for(let k=i;k<=j;k++){const x=info[out[k]-1];if(x&&!rows[out[k]-1].exact)slots.push(k)}
  if(slots.length>1&&new Set(slots.map(k=>info[out[k]-1].street)).size===1){
   const it=slots.map(k=>out[k]).sort((a,b)=>parseInt(info[a-1].num)-parseInt(info[b-1].num)||info[a-1].num.localeCompare(info[b-1].num));
   slots.forEach((k,m)=>out[k]=it[m])}
  i=j+1}return out}
//--END REFINE--
const $=id=>document.getElementById(id),log=m=>$("log").textContent=m;
function parseCSV(t){const rows=[];for(const line of t.trim().split(/\r?\n/)){const f=[];let c="",q=false;
 for(const ch of line){if(ch==='"')q=!q;else if(ch===","&&!q){f.push(c);c=""}else c+=ch}f.push(c);rows.push(f)}
 const h=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])))}
async function geocode(pcs){const out={},u=[...new Set(pcs)];
 for(let i=0;i<u.length;i+=100){const r=await fetch("https://api.postcodes.io/postcodes",{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify({postcodes:u.slice(i,i+100)})}).then(r=>r.json());
  for(const it of r.result)if(it.result)out[it.query]=[it.result.latitude,it.result.longitude]}return out}
async function roadMatrix(P){const n=P.length,B=50,M=Array.from({length:n},()=>Array(n).fill(0)),M0=Array.from({length:n},()=>Array(n).fill(0));let fb=0;
 for(let i=0;i<n;i+=B)for(let j=0;j<n;j+=B){
  const S=[],T=[];for(let k=i;k<Math.min(i+B,n);k++)S.push(k);for(let k=j;k<Math.min(j+B,n);k++)T.push(k);
  let data=null;try{const co=S.concat(T).map(k=>P[k][1]+","+P[k][0]).join(";");
   const url="https://router.project-osrm.org/table/v1/driving/"+co+"?annotations=duration&sources="+S.map((_,x)=>x).join(";")+"&destinations="+T.map((_,x)=>S.length+x).join(";");
   data=(await fetch(url).then(r=>r.json())).durations}catch(e){}
  if(!data)fb++;
  S.forEach((s,a)=>T.forEach((d,b)=>{const v=data&&data[a][b];const w=v==null?hav(P[s],P[d]):v/60;M0[s][d]=w;M[s][d]=v==null?w:w+0.15*hav(P[s],P[d])}));
  await new Promise(r=>setTimeout(r,300))}
 return[M,fb,M0]}
let last=null;
$("file").onchange=async e=>{$("csv").value=await e.target.files[0].text()};
$("go").onclick=async()=>{const btn=$("go");btn.disabled=true;$("out").innerHTML="";
 try{const rows=parseCSV($("csv").value),depot=$("depot").value.trim().toUpperCase();
  if(!rows.length)throw Error("Paste your stops CSV first");
  log("Looking up postcodes...");const geo=await geocode(rows.map(r=>r.postcode).concat(depot));
  const miss=rows.filter(r=>!geo[r.postcode]).map(r=>r.stop);if(miss.length||!geo[depot])throw Error("Postcode not found for stops: "+miss.join(", ")+(geo[depot]?"":" (depot)"));
  const P=[geo[depot]].concat(rows.map(r=>geo[r.postcode]));log("Finding exact house positions...");const[hit,tot,note]=await refine(rows,P);log("Getting road times for "+P.length+" points...");
  const[D,fb,D0]=await roadMatrix(P),n=rows.length;
  const svc=[0].concat(rows.map(r=>parseFloat(r.service_mins)||2)),lo=[0],hi=[1e9];
  rows.forEach(r=>{const[a,b]=(r.window||"00:00-23:59").split("-");lo.push(toMin(a));hi.push(toMin(b))});
  const start=toMin($("start").value),dpd=rows.map((_,i)=>i+1);
  const[best0]=await solve(n,D,svc,lo,hi,start,25,dpd,p=>log("Optimising... "+Math.round(p*100)+"%"));
  const info=rows.map(r=>parseAddr(r.address)),tid=tidy(best0,rows,info),best=evaluate(tid,D,svc,lo,hi,start)<=evaluate(best0,D,svc,lo,hi,start)+0.5?tid:best0;
  const oldD=drive(dpd,D0),newD=drive(best,D0);let t=start,prev=0,late=[];const res=[];
  for(const k of best){t+=D0[prev][k];if(t>hi[k])late.push(rows[k-1].stop);if(t<lo[k])t=lo[k];res.push({k,eta:t});t+=svc[k];prev=k}
  t+=D0[prev][0];last=res.map((x,i)=>({pos:i+1,...rows[x.k-1],eta:fmt(x.eta)}));
  log(fb?"Note: "+fb+" road-time request(s) failed - used straight-line estimates for those areas.":"");
  let h='<div class="sum"><b>Driving time</b><br>DPD order: '+Math.round(oldD)+' min<br>Optimised: '+Math.round(newD)+' min<br><b>Saving: '+Math.round(oldD-newD)+' min</b><br>Back at depot about '+fmt(t)+'<br><span style="color:var(--mut)">Exact house position found for '+hit+' of '+tot+' numbered addresses (rest use postcode centre). '+note+'</span>'+
   (late.length?'<br><span class="tag">May miss window: stop '+late.join(", ")+'</span>':'')+'</div>'+
   '<button id="cp">Copy order (DPD stop numbers)</button><button class="sec" id="dl">Download CSV</button>';
  last.forEach(r=>{h+='<div class="row"><div class="pos">#'+r.pos+'</div><div class="stop">'+r.stop+'</div><div class="det"><b>'+(r.name||r.address)+'</b>'+r.address+', '+r.postcode+
   '<br>'+r.type+(r.window&&!r.window.startsWith("07:00-22")?' <span class="tag">'+r.window+'</span>':'')+'</div><div class="eta">'+r.eta+'</div></div>'});
  $("out").innerHTML=h;
  $("cp").onclick=async()=>{const s=last.map(r=>r.stop).join(", ");try{await navigator.clipboard.writeText(s);$("cp").textContent="Copied"}catch(e){prompt("Copy this:",s)}};
  $("dl").onclick=()=>{const c="new_position,dpd_stop,name,address,postcode,type,window,eta\n"+last.map(r=>[r.pos,r.stop,r.name,r.address,r.postcode,r.type,r.window,r.eta].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
   const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="optimised_route.csv";a.click()};
 }catch(e){log("Error: "+e.message)}btn.disabled=false};
</script></body></html>
